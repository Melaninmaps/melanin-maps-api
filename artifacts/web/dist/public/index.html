    <!--
      Node.js global polyfills — classic (non-module) script runs synchronously
      BEFORE any <script type="module"> so pg / drizzle-orm don't crash in browsers.
      Buffer: npm `buffer` is bundled by Vite; we patch it globally here as a fallback.
      process: minimal stub so pg env-var reads return undefined (not ReferenceError).
      global:  alias for globalThis, expected by some CJS-compat shims.
    -->
    <script>
      if (typeof window.Buffer === 'undefined') {
        /* Minimal browser Buffer shim — replaced by the real npm `buffer` polyfill
           once the JS bundle loads; this just prevents the crash at module init. */
        window.Buffer = {
          isBuffer: function() { return false; },
          from: function(v) { return typeof v === 'string' ? new TextEncoder().encode(v) : new Uint8Array(v); },
          alloc: function(n) { return new Uint8Array(n); },
          concat: function(list) {
            var len = list.reduce(function(a,b){return a+b.length;},0);
            var out = new Uint8Array(len); var i = 0;
            list.forEach(function(b){out.set(b,i);i+=b.length;}); return out;
          }
        };
      }
      if (typeof window.process === 'undefined') {
        window.process = { env: {}, version: '', versions: {}, platform: 'browser', nextTick: function(fn){setTimeout(fn,0);} };
      }
      if (typeof window.global === 'undefined') {
        window.global = window;
      }
    </script>

    <!-- Error capture: report any JS crash to /__client-error so we can see it in Railway logs -->
    <script>
      function _reportErr(msg, src, line, col, err) {
        var payload = JSON.stringify({ msg: String(msg), src: String(src), line: line, col: col, stack: err && err.stack ? err.stack : '' });
        try { navigator.sendBeacon('/__client-error', payload); } catch(e) {}
      }
      window.onerror = function(msg, src, line, col, err) { _reportErr(msg, src, line, col, err); };
      window.addEventListener('unhandledrejection', function(e) {
        var err = e.reason;
        _reportErr('UnhandledRejection: ' + (err && err.message ? err.message : String(err)), location.href, 0, 0, err);
      });
    </script>

  <body>
    <div id="root"></div>

    <!-- Instant loading splash — shown from HTML before any JS loads.
         A MutationObserver removes it the moment React renders its first child.
         No flicker: the splash is position:fixed so it covers the blank root div.
         No external dependencies — pure inline CSS + vanilla JS. -->
    <div id="__mwm_splash" style="
      position:fixed;inset:0;
      background:#1a0f04;
      display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      z-index:9999;
      font-family:'Playfair Display',Georgia,serif;
      transition:opacity 0.3s ease;
    ">
      <div style="
        color:#D4A853;
        font-size:1.4rem;
        font-weight:600;
        letter-spacing:0.06em;
        margin-bottom:1.75rem;
        text-align:center;
        line-height:1.3;
      ">Mapping With Melanin™</div>
      <div style="
        width:36px;height:36px;
        border:3px solid rgba(212,168,83,0.25);
        border-top-color:#D4A853;
        border-radius:50%;
        animation:__mwm_spin 0.75s linear infinite;
      "></div>
      <style>@keyframes __mwm_spin{to{transform:rotate(360deg)}}</style>
    </div>
    <script>
      (function() {
        var splash = document.getElementById('__mwm_splash');
        var root   = document.getElementById('root');
        if (!splash || !root) return;
        var ob = new MutationObserver(function() {
          if (root.childElementCount > 0) {
            ob.disconnect();
            splash.style.opacity = '0';
            splash.style.pointerEvents = 'none';
            setTimeout(function() { if (splash.parentNode) splash.parentNode.removeChild(splash); }, 320);
          }
        });
        ob.observe(root, { childList: true });
      })();
    </script>
