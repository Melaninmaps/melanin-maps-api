kind = "mobile"
previewPath = "/mobile/"
title = "Mapping with Melanin"
version = "1.0.0"
id = "artifacts/mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 18115

[services.development]
run = "EXPO_PUBLIC_REPLIT_DEV_DOMAIN=$REPLIT_DEV_DOMAIN pnpm --filter @workspace/mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mobile", "run", "serve" ]


[services.env]
PORT = "18115"
BASE_PATH = "/mobile/"
