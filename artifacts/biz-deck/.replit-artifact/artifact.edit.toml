kind = "slides"
previewPath = "/biz-deck/"
title = "Mapping With Melanin — App Demo"
version = "1.0.0"
id = "artifacts/biz-deck"
router = "path"

[[integratedSkills]]
name = "slides"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/biz-deck/" ]
localPort = 19816

[services.development]
run = "pnpm --filter @workspace/biz-deck run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/biz-deck", "run", "build" ]
publicDir = "artifacts/biz-deck/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19816"
BASE_PATH = "/biz-deck/"
