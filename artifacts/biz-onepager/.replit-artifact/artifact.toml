kind = "web"
previewPath = "/biz-onepager/"
title = "Mapping With Melanin — Business One-Pager"
version = "1.0.0"
id = "artifacts/biz-onepager"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/biz-onepager/" ]
localPort = 21081

[services.development]
run = "pnpm --filter @workspace/biz-onepager run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/biz-onepager", "run", "build" ]
publicDir = "artifacts/biz-onepager/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21081"
BASE_PATH = "/biz-onepager/"
