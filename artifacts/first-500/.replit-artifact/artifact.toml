kind = "slides"
previewPath = "/first-500/"
title = "The First 500 — Founding Business Campaign"
version = "1.0.0"
id = "artifacts/first-500"
router = "path"

[[integratedSkills]]
name = "slides"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/first-500/" ]
localPort = 25369

[services.development]
run = "pnpm --filter @workspace/first-500 run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/first-500", "run", "build" ]
publicDir = "artifacts/first-500/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25369"
BASE_PATH = "/first-500/"
