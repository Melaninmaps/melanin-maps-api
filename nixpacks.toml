[phases.build]
cmds = [
  # 1. Build the web Vite SPA — output → artifacts/web/dist/public/
  "pnpm --filter @workspace/web run build",
  # 2. Sync web output into api-server/web-static (what api-server build.mjs reads)
  "cp -r artifacts/web/dist/public/. artifacts/api-server/web-static/ && find artifacts/api-server/web-static -name '*.zip' -o -name '*.ipa' -o -name '*.apk' -o -name '*.aab' | xargs rm -f 2>/dev/null || true",
  # 3. Build api-server (esbuild + copies web-static → dist/public + writes BUILD_IDENTITY)
  "pnpm --filter @workspace/api-server run build",
  # 4. Sync api-server output to root dist (what static-server.mjs spawns)
  "cp artifacts/api-server/dist/index.mjs dist/index.mjs",
  "cp artifacts/api-server/dist/index.mjs.map dist/index.mjs.map",
  "cp artifacts/api-server/dist/BUILD_IDENTITY dist/BUILD_IDENTITY",
  "mkdir -p dist/public && cp -r artifacts/api-server/dist/public/. dist/public/"
]

[start]
cmd = "node static-server.mjs"

# Cache-bust: this commit SHA is embedded in the command string itself.
# Docker layer caches key on the command string — when the SHA changes
# (every push), all downstream layers including the TypeScript build
# are invalidated and rebuilt fresh.
[phases.prebuild]
cmds = ["echo build-ref-f93922e9e5ad8551 > /tmp/build_ref.txt"]
