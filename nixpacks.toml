[phases.build]
cmds = [
  # ARCHITECTURE: web assets are committed to git in web-static/.
  # Railway does NOT rebuild the web from source — it uses the committed files.
  # This eliminates Docker layer cache staleness for the frontend bundle.
  #
  # To update the frontend after a web build:
  #   pnpm --filter @workspace/web run build
  #   cp -r artifacts/web/dist/public/. web-static/   ← MUST be dist/public/, not dist/
  #   git add web-static/ && git commit && git push github main
  #
  # ⚠️  Vite outDir = dist/public (see artifacts/web/vite.config.ts:55).
  #     Syncing from dist/ (one level too high) puts assets in web-static/public/assets/
  #     which express.static cannot reach — causing every JS/CSS request to return HTML.
  #
  # 1. Copy committed web-static into api-server/web-static so the api-server
  #    build can embed the web assets (needed for the express.static fallback path).
  "cp -r web-static/. artifacts/api-server/web-static/",
  # 2. Build api-server — esbuild compile + embed web assets.
  #    Literal token changes on every push to bust Docker layer cache.
  "echo \"manus-audit-fix-1754985000\" && pnpm --filter @workspace/api-server run build",
  # 3. Sync api-server bundle to root dist (what static-server.mjs spawns).
  "cp artifacts/api-server/dist/index.mjs dist/index.mjs",
  "cp artifacts/api-server/dist/index.mjs.map dist/index.mjs.map",
  "cp artifacts/api-server/dist/BUILD_IDENTITY dist/BUILD_IDENTITY",
  # 4. Keep root dist/public in sync with web-static (no-op if identical).
  "mkdir -p dist/public && cp -r web-static/. dist/public/"
]

[start]
cmd = "node static-server.mjs"
